name: Generate H41 podcast

on:
  workflow_dispatch:

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ---------------------------
      # 1. H41 → diálogo
      # ---------------------------

      - name: Generate dialogue from H41 days 001-004
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_dialogue.py

      # ---------------------------
      # 2. diálogo → voces
      # ---------------------------

      - name: Generate voices
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_tts.py

      # ---------------------------
      # 3. medir duración
      # ---------------------------

      - name: Measure voice duration
        run: |
          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=nw=1:nk=1 \
            episodes/001/voice.wav)

          echo "AUDIO_DURATION=$DURATION" >> "$GITHUB_ENV"

          echo "Voice duration: $DURATION seconds"

      # ---------------------------
      # 4. generar paisaje sonoro
      # ---------------------------

      - name: Generate procedural music
        run: python generate_music.py

      # ---------------------------
      # 5. mezclar conversación
      # ---------------------------

      - name: Mix voices and procedural bed
        run: |
          ffmpeg -y \
            -i episodes/001/voice.wav \
            -i episodes/001/music.wav \
            -filter_complex \
            "[1:a]volume=0.40[bed]; \
             [bed][0:a]sidechaincompress=threshold=0.025:ratio=3:attack=40:release=500[ducked]; \
             [0:a][ducked]amix=inputs=2:duration=first:normalize=0, \
             alimiter=limit=0.95[out]" \
            -map "[out]" \
            episodes/001/body.wav

      # ---------------------------
      # 6. INTRO HOP + conversación
      # ---------------------------

      - name: Add HOP signature
        run: |
          ffmpeg -y \
            -i HOP_signature_concept3_signal_engine.wav \
            -i episodes/001/body.wav \
            -filter_complex \
            "[0:a]aresample=44100, \
             aformat=sample_fmts=fltp:channel_layouts=mono[intro]; \
             [1:a]aresample=44100, \
             aformat=sample_fmts=fltp:channel_layouts=mono[body]; \
             [intro][body]concat=n=2:v=0:a=1[out]" \
            -map "[out]" \
            -codec:a libmp3lame \
            -b:a 192k \
            episodes/001/episode.mp3

      # ---------------------------
      # 7. artifact
      # ---------------------------

      - name: Upload episode
        uses: actions/upload-artifact@v4
        with:
          name: h41-days-001-004
          path: |
            episodes/001/episode.mp3
            episodes/001/body.wav
            episodes/001/voice.wav
            episodes/001/music.wav
            episodes/001/script.txt
            episodes/001/source.txt
            episodes/001/music.json
